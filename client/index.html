<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StreakCircle</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
</head><body>
<header id="lp"><div class="tb"><b>StreakCircle&reg; &#10035;</b><button class="gt" data-g="today">Start a streak</button></div>
<div id="sp" aria-live="polite"></div><canvas id="c3" aria-label="Tick, a 3D character whose eyes follow your cursor"></canvas>
<div class="tx"><p class="k">Hey there, meet Tick. Your circle&rsquo;s friendliest habit coach.</p><h1>Glad you showed up. Good habits tend to find friends. Now, what are we building today?</h1>
<div class="pl"><button class="pill" data-g="today" data-f="1">Start a habit</button><button class="pill" data-g="circle">Join a circle</button><button class="pill" data-g="circle">Send a nudge</button><button class="pill dk" data-g="insights">See how we track</button></div></div></header>
<main id="app"></main>
<div id="tp" hidden><div class="th"><b>Tick</b><span>watching your streaks</span><button id="tv" title="Voice replies">🔇</button><button id="tpx" aria-label="Close">✕</button></div><div id="tl"></div><div id="tq"><button>How am I doing?</button><button>What next?</button><button>Weak spot?</button></div><div class="ti"><input id="ta" placeholder="Ask Tick, e.g. mark water done" aria-label="Ask Tick"><button id="tm" title="Speak">🎤</button><button id="ts">Send</button></div></div>
<nav id="nav"></nav>
<script type="module" src="/src/main.js"></script></body></html>
